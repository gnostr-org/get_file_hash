
[package]
name = "get_file_hash"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true

[package.metadata.wix]
upgrade-guid = "DED69220-26E3-4406-B564-7F2B58C56F57"
path-guid = "8DB39A25-8B99-4C25-8CF5-4704353C7C6E"
license = false
eula = false
[workspace]
members = [".", "n34", "n34-relay", "src/get_file_hash_core"]

[workspace.package]
version = "970580.1845.799030"
rust-version = "1.88.0"
edition = "2024"
license = "MIT"
authors = ["gnostr admin@gnostr.org"]
documentation = "https://github.com/gnostr-org/get_file_hash#readme"
homepage = "https://github.com/gnostr-org/get_file_hash"
repository = "https://github.com/gnostr-org/get_file_hash"
description = "A utility crate providing a procedural macro to compute and embed file hashes at compile time."

[workspace.dependencies]
chrono = "0.4.41"
convert_case = "0.8.0"
#serde_json = "1.0"
csv = { version = "1.3.0", default-features = false }
dirs = "6.0.0"
easy-ext = "1.0.2"
either = "1.15.0"
frost-secp256k1-tr = "3.0.0-rc.0"
futures = "0.3.31"
get_file_hash_core = { version = ">=970580.1845.799030", features = [
    "nostr",
], path = "src/get_file_hash_core" }
gnostr-n34 = { version = ">=970580.1845.799030", path = "n34" }
gnostr-n34-relay = { version = ">=970580.1845.799030", path = "n34-relay" }

hex = "0.4.2"
log = "0.4"
nostr = { version = "0.44.2", features = ["std", "nip46", "nip96"] }
nostr-browser-signer-proxy = "0.43.0"
nostr-database = { version = "0.44.0", default-features = false }
nostr-lmdb = { version = "0.44.0", default-features = false }
nostr-relay-builder = { version = "0.44.0", default-features = false }
nostr-sdk = { version = "0.44.0", default-features = false, features = [
    "default",
    "pow-multi-thread",
] }
rand = "0.8"
rand_chacha = "0.3"
regex = "1.11.1"
reqwest = { version = "0.12.0", default-features = false }
serde = { version = "1.0.219", default-features = false, features = [
    "alloc",
    "derive",
    "rc",
] }
serde_json = "1.0.145"
serial_test = { version = "3.4.0", features = ["test_logging"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = "1"
toml = "0.9.4"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = "2.5.0"

[features]
nostr = ["dep:nostr", "dep:nostr-sdk", "dep:hex"]
frost = ["dep:nostr", "dep:nostr-sdk", "dep:hex"]
gen-protos = []

[dependencies]
axum = { version = "0.8.6", features = ["http2", "ws"] }
base64 = "0.22.1"
chrono = "0.4.42"
config = { version = "0.15.15", default-features = false, features = ["toml"] }
const_format = "0.2.34"
convert_case = "0.8.0"
#tracing            = "0.1.41"
#tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
dirs = "6.0.0"
easy-ext = "1.0.2"
either = "1.15.0"
flume = "0.11.1"
frost-secp256k1-tr = { workspace = true }
futures = "0.3.31"
get_file_hash_core = { workspace = true, features = ["nostr"] }
gnostr-n34 = { workspace = true }
gnostr-n34-relay = { workspace = true }
hex = { workspace = true, optional = true }
hyper = "1.7.0"
hyper-util = "0.1.17"
nostr = { workspace = true, optional = true }
nostr-sdk = { workspace = true, optional = true }
parking_lot = { version = "0.12.5", features = ["serde"] }
prost = "0.14.1"
rand = { workspace = true }
rand_chacha = { workspace = true }
rhai = { version = "1.23.4", features = [
    "no_position",
    "sync",
    "serde",
    "decimal",
] }
serde = { workspace = true }
serde_json = { workspace = true }
#serde_json         = "1.0.145"
serde_with = "3.15.0"
sha1 = "0.10.6"
sha2 = { workspace = true }
#sha2               = "0.10.9"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.16"
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7.17", features = ["io"] }
toml = "0.9.5"
##tokio = { version = "1.47.1", features = [
##  "macros",
##  "rt-multi-thread",
##  "signal",
##  "fs",
##  "process",
##] }
tonic = { version = "0.14.2", features = [
    "tls-ring",
    "tls-webpki-roots",
    "gzip",
    "deflate",
] }
tonic-prost = "0.14.2"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.6", features = [
    "cors",
    "decompression-br",
    "decompression-deflate",
    "decompression-gzip",
    "decompression-zstd",
    "trace",
    "timeout",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.clap]
features = ["derive"]
version = "4.5.42"

[dependencies.clap-verbosity-flag]
default-features = false
features = ["tracing"]
version = "3.0.3"

[dependencies.nostr-database]
default-features = false
git = "https://git.4rs.nl/mirrors/nostr.git"
rev = "27a1947d3"
version = "0.44.0"
[dependencies.nostr-lmdb]
default-features = false
git = "https://git.4rs.nl/mirrors/nostr.git"
rev = "27a1947d3"
version = "0.44.0"
[dependencies.nostr-relay-builder]
default-features = false
git = "https://git.4rs.nl/mirrors/nostr.git"
rev = "27a1947d3"
version = "0.44.0"
[build-dependencies]
get_file_hash_core = { workspace = true, features = ["nostr"] }
hex = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic-prost-build = "0.14.2"
[target.'cfg(not(windows))'.build-dependencies]
protobuf-src = "2.1.0"

[dev-dependencies]
serial_test = { workspace = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[example]]
name = "gnostr-build"
path = "examples/gnostr-build.rs"
required-features = ["nostr"]

[[example]]
name = "pow_miner"
path = "examples/pow_miner.rs"
required-features = ["nostr"]
